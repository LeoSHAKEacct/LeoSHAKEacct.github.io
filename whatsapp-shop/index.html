<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WhatsApp Shop Bot Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: short header, then a live phone demo beside a keyword editor, then the pitch in plain sections. */
  --ink:#13241f;
  --paper:#f4f6f3;
  --surface:#ffffff;
  --muted:#5b6b65;
  --line:#dce3df;
  --accent:#128a5c;
  --accent-ink:#ffffff;
  --accent-soft:#e2f3ea;
  --chat-bg:#ece5dc;
  --bubble-in:#ffffff;
  --bubble-out:#d6f5c9;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Instrument Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#e6eeea; --paper:#0f1714; --surface:#17221e; --muted:#9aaba4; --line:#2a3833;
    --accent:#2fbf84; --accent-ink:#06130d; --accent-soft:#163a2a;
    --chat-bg:#0c1411; --bubble-in:#1d2b26; --bubble-out:#1f4d36; color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --ink:#e6eeea; --paper:#0f1714; --surface:#17221e; --muted:#9aaba4; --line:#2a3833;
  --accent:#2fbf84; --accent-ink:#06130d; --accent-soft:#163a2a;
  --chat-bg:#0c1411; --bubble-in:#1d2b26; --bubble-out:#1f4d36; color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55}
h1,h2,h3{font-family:var(--display);line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:clamp(28px,5vw,44px);font-weight:700}
h2{font-size:clamp(22px,3.4vw,30px);font-weight:700}
h3{font-size:18px;font-weight:700}
p{margin:0}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* header */
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:18px 0;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:700;font-size:18px;display:flex;align-items:center;gap:8px}
.brand .dot{width:12px;height:12px;border-radius:50%;background:var(--accent)}
.langs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px}
.langs button{border:0;background:transparent;color:var(--ink);padding:6px 14px;border-radius:999px;font-weight:600;font-size:14px}
.langs button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.hero{padding:18px 0 28px;display:grid;gap:12px;max-width:720px}
.hero p{color:var(--muted);font-size:18px;max-width:62ch}

/* demo grid */
.demo{display:grid;grid-template-columns:minmax(300px,380px) 1fr;gap:28px;align-items:start}
@media (max-width:820px){.demo{grid-template-columns:1fr}.phone{margin:0 auto}}

.phone{width:100%;max-width:380px;height:680px;border-radius:36px;background:#0b0f0d;padding:10px;box-shadow:0 20px 50px rgba(10,30,20,.18);position:relative}
.screen{height:100%;border-radius:28px;overflow:hidden;display:flex;flex-direction:column;background:var(--chat-bg);position:relative}
.chat-head{background:#0f6b48;color:#fff;display:flex;align-items:center;gap:10px;padding:12px 14px}
.avatar{width:38px;height:38px;border-radius:50%;background:#f2c14e;color:#13241f;display:grid;place-items:center;font-family:var(--display);font-weight:700}
.chat-head .name{font-weight:600;line-height:1.2}
.chat-head .status{font-size:12px;opacity:.85}
.chat-head .restart{margin-left:auto;background:rgba(255,255,255,.15);border:0;color:#fff;border-radius:999px;padding:5px 10px;font-size:12px}
.msgs{flex:1;overflow-y:auto;padding:14px 10px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:84%;padding:8px 10px 6px;border-radius:10px;font-size:14.5px;line-height:1.4;box-shadow:0 1px 1px rgba(0,0,0,.08);word-wrap:break-word}
.msg.in{background:var(--bubble-in);align-self:flex-start;border-top-left-radius:2px}
.msg.out{background:var(--bubble-out);align-self:flex-end;border-top-right-radius:2px}
.msg .time{display:block;text-align:right;font-size:11px;color:var(--muted);margin-top:2px}
.msg code{font-family:ui-monospace,Menlo,monospace;font-size:13px;background:var(--accent-soft);padding:0 4px;border-radius:4px}
.qr{display:flex;flex-wrap:wrap;gap:6px;align-self:flex-start;max-width:92%}
.qr button{border:1px solid var(--line);background:var(--bubble-in);color:var(--accent);font-weight:600;font-size:13px;padding:6px 12px;border-radius:999px}
.card{margin-top:6px;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.card .c-body{padding:8px 10px}
.card .c-title{font-weight:600}
.card .c-sub{font-size:12px;color:var(--muted)}
.card button{display:block;width:100%;border:0;border-top:1px solid var(--line);background:transparent;color:var(--accent);font-weight:600;padding:8px}
.typing{align-self:flex-start;background:var(--bubble-in);border-radius:10px;padding:8px 12px;font-size:13px;color:var(--muted)}
.composer{display:flex;gap:8px;padding:8px;background:transparent}
.composer input{flex:1;border:0;border-radius:999px;padding:11px 16px;font:inherit;font-size:15px;background:var(--surface);color:var(--ink)}
.composer button{width:44px;height:44px;border-radius:50%;border:0;background:#0f6b48;color:#fff;display:grid;place-items:center}

/* catalogue overlay */
.catalog{position:absolute;inset:0;background:var(--surface);display:flex;flex-direction:column;transform:translateY(100%);transition:transform .3s ease;z-index:3}
.catalog.open{transform:translateY(0)}
@media (prefers-reduced-motion:reduce){.catalog{transition:none}}
.cat-bar{padding:10px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.cat-bar .url{flex:1;font-size:12px;color:var(--muted);background:var(--paper);border-radius:999px;padding:6px 12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cat-bar button{border:0;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:6px 12px;font-weight:600;font-size:13px}
.cat-head{padding:14px 14px 6px}
.cat-head p{font-size:13px;color:var(--muted)}
.grid{flex:1;overflow-y:auto;padding:8px 14px 14px;display:grid;grid-template-columns:1fr 1fr;gap:10px;align-content:start}
.prod{border:1px solid var(--line);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:6px}
.thumb{aspect-ratio:1;border-radius:8px;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:28px;color:#13241f}
.prod .pname{font-size:13px;font-weight:600;line-height:1.25;min-height:2.5em}
.prod .row{display:flex;justify-content:space-between;align-items:center;gap:4px}
.prod .price{font-size:13px;font-variant-numeric:tabular-nums}
.prod .code{font-size:11px;color:var(--muted)}
.prod button{border:0;background:var(--accent-soft);color:var(--accent);font-weight:600;border-radius:8px;padding:6px;font-size:13px}
.cat-foot{border-top:1px solid var(--line);padding:10px 14px;display:flex;justify-content:space-between;align-items:center;font-size:14px}
.cat-foot b{font-variant-numeric:tabular-nums}

/* side panel */
.side{display:grid;gap:18px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:grid;gap:12px}
.panel p.note{color:var(--muted);font-size:14px}
.cmds{display:grid;gap:6px}
.cmd{display:flex;gap:10px;align-items:baseline;border-bottom:1px dashed var(--line);padding-bottom:6px;font-size:14px}
.cmd button{font-family:ui-monospace,Menlo,monospace;font-weight:700;font-size:13px;border:1px solid var(--accent);color:var(--accent);background:transparent;border-radius:6px;padding:2px 8px;white-space:nowrap}
.cmd span{color:var(--muted)}
form.kw{display:grid;gap:8px}
form.kw label{font-size:13px;font-weight:600}
form.kw input,form.kw textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 12px;font:inherit;font-size:14px;background:var(--paper);color:var(--ink)}
form.kw textarea{min-height:64px;resize:vertical}
.btn{border:0;background:var(--accent);color:var(--accent-ink);font-weight:600;border-radius:10px;padding:10px 14px}
.kwlist{display:grid;gap:6px}
.kwitem{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start;font-size:14px;padding:8px 10px;border-radius:10px;background:var(--paper)}
.kwitem b{font-family:ui-monospace,Menlo,monospace;font-size:13px;color:var(--accent)}
.kwitem span{color:var(--muted)}
.kwitem button{border:0;background:transparent;color:var(--muted);font-size:13px;text-decoration:underline}

/* pitch */
section.pitch{padding:56px 0 0;display:grid;gap:18px}
.lead{color:var(--muted);font-size:17px;max-width:65ch}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.benefits{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.plans{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.faq{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:820px){.steps,.benefits,.plans,.faq{grid-template-columns:1fr}}
.box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:grid;gap:6px;align-content:start}
.box p{color:var(--muted);font-size:15px}
.step-n{font-family:var(--display);font-weight:700;color:var(--accent);font-size:15px}
.box ul{margin:4px 0 0;padding-left:18px;color:var(--muted);font-size:15px;display:grid;gap:4px}
.plan-tag{font-size:13px;font-weight:600;color:var(--accent)}
.fine{font-size:14px;color:var(--muted)}
.cta{margin:56px 0 0;background:#0f6b48;color:#fff;border-radius:20px;padding:28px;display:grid;gap:10px}
.cta p{opacity:.9;max-width:60ch}
.cta .who{font-weight:600;opacity:1}
.presenter{margin-top:28px;border:2px dashed var(--accent);border-radius:16px;padding:20px;display:none;gap:10px;background:var(--surface)}
.presenter.show{display:grid}
.presenter p{max-width:65ch}
footer{padding:40px 0 48px;color:var(--muted);font-size:13px}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><span class="dot" aria-hidden="true"></span><span id="t-brand"></span></div>
    <div class="langs" role="group" aria-label="Language">
      <button id="l-en" data-l="en">EN</button>
      <button id="l-es" data-l="es">ES</button>
      <button id="l-pt" data-l="pt">PT</button>
    </div>
  </header>

  <div class="hero">
    <h1 id="t-h1"></h1>
    <p id="t-sub"></p>
  </div>

  <div class="demo">
    <div class="phone">
      <div class="screen">
        <div class="chat-head">
          <div class="avatar" aria-hidden="true">N</div>
          <div><div class="name">Norte Market</div><div class="status" id="t-status"></div></div>
          <button class="restart" id="restart"></button>
        </div>
        <div class="msgs" id="msgs" aria-live="polite"></div>
        <form class="composer" id="composer">
          <input id="input" autocomplete="off" aria-label="Message">
          <button type="submit" aria-label="Send"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 20.5 21.5 12 3 3.5 3 10l13 2-13 2z"/></svg></button>
        </form>

        <div class="catalog" id="catalog" aria-hidden="true">
          <div class="cat-bar">
            <div class="url">norte.shop/catalogue</div>
            <button id="cat-close"></button>
          </div>
          <div class="cat-head"><h3 id="t-cattitle"></h3><p id="t-catsub"></p></div>
          <div class="grid" id="grid"></div>
          <div class="cat-foot"><span id="cat-count"></span><b id="cat-total"></b></div>
        </div>
      </div>
    </div>

    <div class="side">
      <div class="panel">
        <h3 id="t-try"></h3>
        <p class="note" id="t-trynote"></p>
        <div class="cmds" id="cmds"></div>
      </div>
      <div class="panel">
        <h3 id="t-kwtitle"></h3>
        <p class="note" id="t-kwnote"></p>
        <form class="kw" id="kwform">
          <label for="kw-key" id="t-kwkey"></label>
          <input id="kw-key" required maxlength="24">
          <label for="kw-reply" id="t-kwreply"></label>
          <textarea id="kw-reply" required maxlength="400"></textarea>
          <button class="btn" type="submit" id="t-kwadd"></button>
        </form>
        <div class="kwlist" id="kwlist"></div>
      </div>
    </div>
  </div>

  <section class="pitch">
    <h2 id="t-probh"></h2>
    <p class="lead" id="t-probp"></p>
  </section>

  <section class="pitch">
    <h2 id="t-howh"></h2>
    <div class="steps" id="steps"></div>
  </section>

  <section class="pitch">
    <h2 id="t-benh"></h2>
    <div class="benefits" id="benefits"></div>
  </section>

  <section class="pitch">
    <h2 id="t-planh"></h2>
    <div class="plans" id="plans"></div>
    <p class="fine" id="t-planfine"></p>
  </section>

  <section class="pitch">
    <h2 id="t-faqh"></h2>
    <div class="faq" id="faq"></div>
  </section>

  <div class="cta">
    <h2 id="t-ctah"></h2>
    <p id="t-ctap"></p>
    <p class="who"><a href="https://mamacita.hollyai.app/" style="color:#fff">mamacita.hollyai.app</a> · <span id="t-ctawho"></span></p>
  </div>

  <div class="presenter" id="presenter">
    <h3 id="t-presh"></h3>
    <div id="presbody" style="display:grid;gap:10px"></div>
  </div>

  <footer id="t-foot"></footer>
</div>

<script>

// Synonyms work in every language, so a Spanish speaker on the English demo still gets understood.
const SYN = {
  menu:["menu","help","ayuda","ajuda","hi","hello","hola","ola","oi","start","inicio","opciones","opcoes","options","bom dia","buenas","buenos dias"],
  shop:["shop","store","catalog","catalogue","catalogo","tienda","loja","products","productos","produtos","comprar","buy"],
  cart:["cart","carrito","carrinho","bag","basket","cesta"],
  pay:["pay","checkout","pagar","pago","pagamento","payment"],
  track:["track","tracking","status","rastrear","seguimiento","estado","encomenda","delivery","entrega"],
  human:["human","agent","person","humano","agente","persona","pessoa","atendente","asesor"],
  clear:["clear","empty","vaciar","limpar","esvaziar","reset"]
};

let lang="en", presenter=false, cart={}, lastOrder=null, orderSeq=1040, custom=[], userAdded=[];
const $=id=>document.getElementById(id);
const msgs=$("msgs");
const norm=s=>s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/^[\/#!]+/,"").trim();
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const rich=s=>esc(s).replace(/\*([^*]+)\*/g,"<b>$1</b>").replace(/\n/g,"<br>");
const now=()=>{const d=new Date();return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")};
const t=()=>T[lang];
const price=n=>FMT[lang].format(n);
const count=()=>Object.values(cart).reduce((a,b)=>a+b,0);
const sum=()=>Object.entries(cart).reduce((a,[id,q])=>a+PRODUCTS[id-1].p[lang]*q,0);

function scroll(){msgs.scrollTop=msgs.scrollHeight}
function addMsg(text,dir,card){
  const el=document.createElement("div");
  el.className="msg "+dir;
  el.innerHTML=rich(text);
  if(card){
    const c=document.createElement("div");c.className="card";
    c.innerHTML=`<div class="c-body"><div class="c-title">${esc(card.title)}</div><div class="c-sub">${esc(card.sub)}</div></div>`;
    const b=document.createElement("button");b.type="button";b.textContent=card.btn;b.onclick=card.action;c.appendChild(b);el.appendChild(c);
  }
  const tm=document.createElement("span");tm.className="time";tm.textContent=now()+(dir==="out"?" ✓✓":"");el.appendChild(tm);
  msgs.appendChild(el);scroll();
}
function addQR(keys){
  const q=document.createElement("div");q.className="qr";
  keys.forEach(k=>{const b=document.createElement("button");b.type="button";b.textContent=k;b.onclick=()=>send(k);q.appendChild(b)});
  msgs.appendChild(q);scroll();
}
function bot(fn){
  const ty=document.createElement("div");ty.className="typing";ty.textContent="…";msgs.appendChild(ty);scroll();
  setTimeout(()=>{ty.remove();fn()},450);
}
function mainQR(){const k=t().K;addQR([k.shop,k.cart,k.pay,k.track,k.human])}

function cartText(){
  const L=t();
  const lines=Object.entries(cart).map(([id,q])=>{const p=PRODUCTS[id-1];return `${q} × ${p[lang]} · ${price(p.p[lang]*q)}`});
  return `${L.cartHead}\n${lines.join("\n")}\n*${L.total}: ${price(sum())}*\n\n${L.cartFoot(L.K)}`;
}
function addToCart(id,q){cart[id]=(cart[id]||0)+q;updateCatFoot()}

function intent(text){
  const n=norm(text);
  for(const c of custom){if(n===norm(c.key)||n.split(/\s+/).includes(norm(c.key)))return {type:"custom",reply:c.reply}}
  const m=n.match(/(?:^|\s)(?:order|add|pedir|pido|agregar|anadir|adicionar|quero|quiero|pedido)\s*#?(\d+)(?:\s*(?:x|×)\s*(\d+))?/);
  if(m)return {type:"order",id:+m[1],q:m[2]?Math.min(+m[2],20):1};
  const words=" "+n.replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ")+" ";
  const order=["clear","pay","cart","track","human","shop","menu"];
  for(const k of order){if(SYN[k].some(w=>words.includes(" "+w+" ")))return {type:k}}
  return {type:"none"};
}

function respond(text){
  const L=t(),K=L.K,it=intent(text);
  bot(()=>{
    switch(it.type){
      case "custom": addMsg(it.reply,"in"); break;
      case "menu": addMsg(L.menu(K),"in"); mainQR(); break;
      case "shop": addMsg(L.shop,"in",{title:L.catCard,sub:"norte.shop/catalogue",btn:L.openCat,action:openCat}); break;
      case "order":{
        const p=PRODUCTS[it.id-1];
        if(!p){addMsg(L.notFound(it.id,K),"in");break}
        addToCart(it.id,it.q); addMsg(L.added(it.q,p[lang]),"in"); addQR([K.cart,K.pay,K.shop]); break;}
      case "cart": if(!count()){addMsg(L.cartEmpty(K),"in");addQR([K.shop])} else {addMsg(cartText(),"in");addQR([K.pay,K.clear])} break;
      case "clear": cart={}; updateCatFoot(); addMsg(L.cleared,"in"); addQR([K.shop]); break;
      case "pay":
        if(!count()){addMsg(L.cartEmpty(K),"in");addQR([K.shop]);break}
        addMsg(L.pay(price(sum())),"in",{title:L.payCard,sub:L.paySub,btn:L.payBtn,action:payNow}); break;
      case "track": if(!lastOrder){addMsg(L.trackNone,"in");addQR([K.shop])} else addMsg(L.track(lastOrder),"in"); break;
      case "human": addMsg(L.human,"in"); break;
      default: addMsg(L.fallback(K),"in"); addQR([K.menu,K.shop]);
    }
  });
}
function send(text){text=text.trim();if(!text)return;addMsg(text,"out");respond(text)}
let paying=false;
function payNow(){
  if(paying||!count())return; paying=true;
  bot(()=>{orderSeq++;lastOrder=orderSeq;cart={};updateCatFoot();addMsg(t().paid(lastOrder),"in");addQR([t().K.track]);paying=false});
}

/* catalogue */
let addedSinceOpen=0;
function renderGrid(){
  const L=t(),g=$("grid");g.innerHTML="";
  PRODUCTS.forEach(p=>{
    const d=document.createElement("div");d.className="prod";
    d.innerHTML=`<div class="thumb" style="background:${p.color}">${p.id}</div><div class="pname">${esc(p[lang])}</div><div class="row"><span class="price">${price(p.p[lang])}</span><span class="code">${esc(L.code(p.id))}</span></div>`;
    const b=document.createElement("button");b.type="button";b.textContent=L.add;
    b.onclick=()=>{addToCart(p.id,1);addedSinceOpen++;b.textContent="✓";setTimeout(()=>b.textContent=L.add,700)};
    d.appendChild(b);g.appendChild(d);
  });
  updateCatFoot();
}
function updateCatFoot(){$("cat-count").textContent=t().items(count());$("cat-total").textContent=price(sum())}
function openCat(){addedSinceOpen=0;renderGrid();$("catalog").classList.add("open");$("catalog").setAttribute("aria-hidden","false");$("cat-close").focus()}
function closeCat(){
  $("catalog").classList.remove("open");$("catalog").setAttribute("aria-hidden","true");
  if(addedSinceOpen>0){const L=t();bot(()=>{addMsg(L.cartUpd(count())+"\n\n"+cartText(),"in");addQR([L.K.pay,L.K.shop])})}
  $("input").focus();
}

/* keywords panel */
function rebuildCustom(){custom=[...t().kwDefaults.map(([key,reply])=>({key,reply})),...userAdded]}
function renderKW(){
  const L=t(),list=$("kwlist");list.innerHTML="";
  custom.forEach(c=>{
    const row=document.createElement("div");row.className="kwitem";
    row.innerHTML=`<b>${esc(c.key.toUpperCase())}</b><span>${esc(c.reply)}</span>`;
    const tb=document.createElement("button");tb.type="button";tb.textContent=L.remove;
    tb.onclick=()=>{custom=custom.filter(x=>x!==c);userAdded=userAdded.filter(x=>x!==c);renderKW();renderCmds()};
    row.appendChild(tb);list.appendChild(row);
  });
}
function renderCmds(){
  const L=t(),box=$("cmds");box.innerHTML="";
  const rows=[...L.cmds(L.K),...custom.map(c=>[c.key.toUpperCase(),c.reply.length>48?c.reply.slice(0,46)+"…":c.reply])];
  rows.forEach(([k,d])=>{
    const r=document.createElement("div");r.className="cmd";
    const b=document.createElement("button");b.type="button";b.textContent=k;b.onclick=()=>send(k);
    const s=document.createElement("span");s.textContent=d;r.appendChild(b);r.appendChild(s);box.appendChild(r);
  });
}
$("kwform").addEventListener("submit",e=>{
  e.preventDefault();
  const key=$("kw-key").value.trim().replace(/\s+/g,"_"),reply=$("kw-reply").value.trim();
  if(!key||!reply)return;
  custom=custom.filter(c=>norm(c.key)!==norm(key));userAdded=userAdded.filter(c=>norm(c.key)!==norm(key));
  const item={key,reply};custom.unshift(item);userAdded.unshift(item);
  $("kw-key").value="";$("kw-reply").value="";renderKW();renderCmds();
  send(key.toUpperCase());
});

/* page text */
function fill(id,v){$(id).textContent=v}
function boxes(id,items,fn){const el=$(id);el.innerHTML="";items.forEach((it,i)=>{const d=document.createElement("div");d.className="box";d.innerHTML=fn(it,i);el.appendChild(d)})}
function renderPage(){
  const L=t();
  document.documentElement.lang=lang;
  ["en","es","pt"].forEach(l=>$("l-"+l).setAttribute("aria-pressed",String(l===lang)));
  fill("t-brand",L.brand);fill("t-h1",L.h1);fill("t-sub",L.sub);fill("t-status",L.status);fill("restart",L.restart);
  $("input").placeholder=L.placeholder;fill("cat-close",L.catClose);fill("t-cattitle",L.catTitle);fill("t-catsub",L.catSub);
  fill("t-try",L.tryH);fill("t-trynote",L.tryNote);fill("t-kwtitle",L.kwH);fill("t-kwnote",L.kwNote);
  fill("t-kwkey",L.kwKey);fill("t-kwreply",L.kwReply);fill("t-kwadd",L.kwAdd);
  fill("t-probh",L.probH);fill("t-probp",L.probP);fill("t-howh",L.howH);fill("t-benh",L.benH);fill("t-planh",L.planH);fill("t-planfine",L.planFine);fill("t-faqh",L.faqH);
  fill("t-ctah",L.ctaH);fill("t-ctap",L.ctaP);fill("t-ctawho",L.ctaWho);fill("t-presh",L.presH);fill("t-foot",L.foot);
  boxes("steps",L.steps,([h,p],i)=>`<span class="step-n">${i+1}</span><h3>${esc(h)}</h3><p>${esc(p)}</p>`);
  boxes("benefits",L.benefits,([h,p])=>`<h3>${esc(h)}</h3><p>${esc(p)}</p>`);
  boxes("plans",L.plans,([h,tag,list])=>`<span class="plan-tag">${esc(tag)}</span><h3>${esc(h)}</h3><ul>${list.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`);
  boxes("faq",L.faq,([h,p])=>`<h3>${esc(h)}</h3><p>${esc(p)}</p>`);
  $("presbody").innerHTML=L.pres.map(x=>`<p>${esc(x)}</p>`).join("");
  $("presenter").classList.toggle("show",presenter);
}
function startChat(){
  msgs.innerHTML="";cart={};lastOrder=null;
  addMsg(t().welcome,"in");mainQR();
}
function setLang(l,updateHash){
  lang=l;rebuildCustom();renderPage();renderKW();renderCmds();renderGrid();startChat();
  if(updateHash){try{history.replaceState(null,"","#"+lang+(presenter?"-presenter":""))}catch(e){}}
}
function readHash(){
  const h=(location.hash||"").slice(1);
  presenter=/presenter/.test(h);
  const l=(h.match(/^(en|es|pt)/)||[])[1];
  return l||"en";
}
document.querySelectorAll(".langs button").forEach(b=>b.addEventListener("click",()=>setLang(b.dataset.l,true)));
$("composer").addEventListener("submit",e=>{e.preventDefault();const v=$("input").value;$("input").value="";send(v)});
$("restart").addEventListener("click",startChat);
$("cat-close").addEventListener("click",closeCat);
window.addEventListener("hashchange",()=>{const l=readHash();if(l!==lang)setLang(l,false);else renderPage()});
setLang(readHash(),false);
</script>
